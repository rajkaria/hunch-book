[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
# Tests and scripts run on Monad's EVM rules (same as `--network monad`).
network = "monad"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "../deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "solady/=lib/solady/src/",
]
# Fork tests read live Monad state; they run only when the RPC variables are set.
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 1_000

[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = true

# `FOUNDRY_PROFILE=fork forge test` runs only the fork suites against live Monad RPCs.
[profile.fork]
match_path = "test/fork/**"
no_match_path = "test/__none__/**"

[profile.ci.fuzz]
runs = 5_000

[profile.ci.invariant]
runs = 512
depth = 256
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
monad_mainnet = "${MONAD_MAINNET_RPC}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
