  "Template 7 snapshots taken, and how many of them one of our wallets sent."
  snapshotsTaken: Int!
  snapshotsTakenOurs: Int!
  "AutoRedeemer: holders opted in now, redemptions made, USDC paid, those called by our wallets, and failures."
  autoRedeemHolders: Int!
  autoRedemptionCount: Int!
  autoRedeemedUsdc: BigInt!
  autoRedemptionCountOurCaller: Int!
  autoRedeemFailures: Int!
  "ConditionalOrders: placed, open now (expired ones included), executed, cancelled, and executed by our wallets."
  conditionalOrdersPlaced: Int!
  conditionalOrdersOpen: Int!
  conditionalOrdersExecuted: Int!
  conditionalOrdersCancelled: Int!
  conditionalOrdersExecutedByUs: Int!
  "ReferralRegistry: bindings, those a wallet of ours relayed, distinct referrers, and referred users' fees while bound."
  referralBindings: Int!
  referralBindingsRelayedByUs: Int!
  referrers: Int!
  referredFeeCount: Int!
  referredFees: BigInt!
  "The protocol's share of referred users' fees: the base referral credits are computed from."
  referredProtocolShare: BigInt!
  "MerkleDistributor epochs and claims. Amounts are per token, in RewardToken."
  rewardEpochs: Int!
  rewardClaimCount: Int!
  "ImpliedProbabilityOracle pokes, those our wallets sent, and the checkpoints they stored."
  oraclePokes: Int!
  oraclePokesOurs: Int!
  oracleCheckpoints: Int!
  "OutcomeTokenPriceAdapter contracts created."
  priceAdapters: Int!
  "TemplateTimelock operations: queued, executed, cancelled, and still queued now."
  timelockQueued: Int!
  timelockExecuted: Int!
  timelockCancelled: Int!
  timelockPending: Int!
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
}

